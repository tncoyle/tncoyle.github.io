<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QR Code Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f5f5;--card:#fff;--ink:#3b3b3b;--head:#0046ad;--muted:#5f5f5f;--accent:#0046ad;--accent-ink:#fff;--green:#478316;--line:#d9edf7;--err:#a8271c;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#003366;--card:#0a2a4f;--ink:#f5f5f5;--head:#d9edf7;--muted:#b7c8dc;--accent:#d9edf7;--accent-ink:#003366;--green:#539c16;--line:#2a5486;--err:#ffb4a8}}
:root[data-theme="dark"]{--bg:#003366;--card:#0a2a4f;--ink:#f5f5f5;--head:#d9edf7;--muted:#b7c8dc;--accent:#d9edf7;--accent-ink:#003366;--green:#539c16;--line:#2a5486;--err:#ffb4a8}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center;padding:24px 16px}
main{width:100%;max-width:440px;margin:auto}
h1{font-size:2rem;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;color:var(--head)}
p.lead{margin:0 0 22px;color:var(--muted);line-height:1.5}
form{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--green);outline-offset:2px}
button{font:inherit;font-weight:600;padding:12px 18px;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
#msg{min-height:1.4em;margin:8px 2px 0;font-size:.9rem;color:var(--err)}
#stage{margin-top:14px;padding:22px;border-radius:14px;background:var(--card);border:2px solid var(--line);border-top:6px solid var(--green);text-align:center}
#wrap{position:relative;display:inline-block;background:#fff;border-radius:6px;line-height:0}
#qr{padding:14px}
#qr img,#qr canvas{max-width:100%;height:auto}
#logo{position:absolute;top:50%;left:50%;width:58px;height:58px;transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;background:#0046ad;color:#fff;font-weight:800;font-size:25px;letter-spacing:-.02em;line-height:1;border:5px solid #fff;border-radius:12px;box-sizing:content-box;width:48px;height:48px}
#empty{color:var(--muted);margin:0;padding:70px 0}
#out[hidden],#empty[hidden]{display:none}
#url{margin:14px 0 4px;font-size:.9rem;word-break:break-all;color:var(--ink)}
.hint{margin:0;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>QR code generator</h1>
  <p class="lead">Paste a web address and get a code you can scan.</p>
  <form id="f" novalidate>
    <input id="u" type="text" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="example.com/page" aria-label="URL">
    <button type="submit">Generate</button>
  </form>
  <div id="msg" role="alert"></div>
  <section id="stage" aria-live="polite">
    <p id="empty">Your QR code will appear here.</p>
    <div id="out" hidden>
      <div id="wrap"><div id="qr"></div><div id="logo" aria-hidden="true">FL</div></div>
      <p id="url"></p>
      <p class="hint">Press and hold or right-click the code to save the image.</p>
    </div>
  </section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
(function(){
  var f=document.getElementById('f'),u=document.getElementById('u'),msg=document.getElementById('msg'),
      out=document.getElementById('out'),empty=document.getElementById('empty'),
      qrBox=document.getElementById('qr'),urlEl=document.getElementById('url'),qr=null;

  function normalize(v){
    v=v.trim();
    if(!v) throw new Error('Enter a URL to get started.');
    if(!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v='https://'+v;
    var p=new URL(v);
    if(!/^https?:$/.test(p.protocol)) throw new Error('Use a web address that starts with http or https.');
    if(p.hostname.indexOf('.')<1 && p.hostname!=='localhost') throw new Error('That does not look like a full web address, for example example.com.');
    return p.href;
  }

  f.addEventListener('submit',function(e){
    e.preventDefault();
    msg.textContent='';
    var href;
    try{ href=normalize(u.value); }
    catch(err){ msg.textContent=(err instanceof TypeError)?'That is not a valid URL. Check it and try again.':err.message; return; }
    if(typeof QRCode==='undefined'){ msg.textContent='The QR library did not load. Reload the page and try again.'; return; }
    try{
      if(!qr){ qr=new QRCode(qrBox,{text:href,width:256,height:256,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.H}); }
      else { qr.clear(); qr.makeCode(href); }
    }catch(err){ msg.textContent='That URL is too long to fit in a QR code. Try a shorter link.'; return; }
    urlEl.textContent=href;
    empty.hidden=true; out.hidden=false;
  });
})();
</script>
</body>
</html>
